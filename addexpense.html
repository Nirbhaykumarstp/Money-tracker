<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>AddExpense</title>
    <link rel='stylesheet' href='./src/output.css'>
</head>

<body>
    <header class="w-full py-5 shadow-lg bg-blue-100">
        <nav class="w-full">
            <ul class="flex  justify-between flex-row-reverse">
                <div class="flex flex-row justify-center gap-5 text-xl px-5">
                    <li class="underline underline-offset-3"><a href="dashboard.html">Dashboard</a></li>
                    <li class="underline underline-offset-3"><a href="income.html">Income</a></li>
                    <li class="underline underline-offset-3"><a href="expense.html">Expense</a></li>
                </div>
                <div class="px-5">
                    <h1 class="text-3xl font-bold text-center">MyKha₹cha</h1>
                </div>
            </ul>
        </nav>
    </header>
    <main class="py-5">
        <div class="w-full max-w-md  p-6 rounded-lg shadow-2xl shadow-black sm:w-1/2 sm:m-auto lg:m-auto">
            <h1 class="text-2xl font-bold text-center mb-6">
                AddExpense
            </h1>

            <form class="flex flex-col gap-10">

                <div class="mb-4">
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
                        Amount
                    </label>

                    <input type="number" id="amount" name="amount" placeholder="Enter the amount.." class="w-full px-3 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>


                <div class="mb-4 flex flex-row gap-10">
                    <div class="mb-4">
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-0">
                            Category
                        </label>
                        <select name="category" id="category" class="w-full max-w-md px-3 py-2  border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2>
                            <option value="Food">Food</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Travel">Travel</option>
                            <option value="Stay">Stay</option>
                            <option value="Medicine">Medicine</option>
                            <option value="Shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="date" class="block text-sm font-medium text-gray-700 mb-1">
                            Date
                        </label>

                        <input type="date" id="date" name="date" placeholder="Enter the date" class="w-full px-3 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
                        Title
                    </label>
                    <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full text-xl bg-red-500 text-black py-2 rounded-md
                     transition duration-300">
                    Add
                </button>
            </form>
        </div>
    </main>
</body>

</html>
