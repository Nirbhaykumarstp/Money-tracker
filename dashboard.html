<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Dashboard</title>
    <link rel='stylesheet' href='./src/output.css'>

</head>

<body class="font-serif">
    <header class="w-full py-5 shadow">
        <nav class="w-full">
            <ul class="flex flex-row justify-between">
                <div class="flex flex-row justify-center gap-5 text-xl px-3">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="income.html">Income</a></li>
                    <li><a href="expense.html">Expense</a></li>
                </div>
                <div class="px-3">
                    <li class="text-red-700"><a href="logout">Logout</a></li>
                </div>
            </ul>
        </nav>
    </header>
    <main>
        <section id="filter" class="px-3 py-5">
            <div>
                <h2 class="text-3xl">Filters</h2>
                <div class="flex flex-row gap-10">
                    <div>
                        <label for="month" class="text-xl">Select the Month:</label>
                        <select name="month" id="month" class="px-2 py-2">
                            <option value="January">Jan</option>
                            <option value="February">Feb</option>
                            <option value="March">Mar</option>
                            <option value="April">Apr</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">Aug</option>
                            <option value="September">Sept</option>
                            <option value="October">Oct</option>
                            <option value="November">Nov</option>
                            <option value="December">Dec</option>
                        </select>
                    </div>
                    <div class="flex flex-row gap-5">
                        <label for="from" class="text-xl">
                            From:</label>
                        <input type="date" class="px-2 py-2">

                        <label for="to" class="text-xl">
                            To:</label>
                        <input type="date" class="px-2 py-2">

                    </div>
                </div>
            </div>
        </section>
        <section class="current-month px-3 py-3">
            <h1 class="text-4xl font-bold  py-3">September</h1>
        </section>
        <section class="info flex flex-row justify-center gap-15">
            <div class="border-2 px-2 py-2 rounded w-tenth h-tenth text-center">
                <h1 class="text-4xl">Income</h1>
                <h2 class="text-3xl">₹<span>800</span></h2>
            </div>
            <div class="border-2 px-2 py-2 rounded w-tenth h-tenth text-center">
                <h1 class="text-4xl">Expense</h1>
                <h2 class="text-3xl">₹<span>300</span></h2>
            </div>
            <div class="border-2 px-2 py-2 rounded w-tenth h-tenth text-center">
                <h1 class="text-4xl">Savings</h1>
                <h2 class="text-3xl">₹<span>500</span></h2>
            </div>
        </section>
        <section class="charts">
            <h2>Charts</h2>
        </section>
        <section class="monthly-repo px-2 py-3 flex flex-col justify-center">
            <h2 class="text-4xl">Report</h2>
            <table>
                <thead class="text-xl shadow-2xs">
                    <tr>
                        <th>Month</th>
                        <th>Income</th>
                        <th>Expense</th>
                        <th>Balance</th>
                        <th>saved</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="text-center">
                        <td>september</td>
                        <td>800</td>
                        <td>500</td>
                        <td>300</td>
                        <td>67%</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="total-transaction px-2 py-3 flex flex-col justify-center">
            <h2 class="text-4xl">Total Transaction</h2>
            <table class="repo-table">
                    <thead class="text-xl shadow-2xs">
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody class="text-center">
                        <tr>
                            <td>2 sep</td>
                            <td>Bonus</td>
                            <td>50</td>
                        </tr>
                        <tr>
                            <td>3sep</td>
                            <td>Salary</td>
                            <td>100</td>
                        </tr>
                        <tr>
                            <td>5sep</td>
                            <td>Gift</td>
                            <td>300</td>
                        </tr>
                    </tbody>
                </table>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
