<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>SignUp</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="flex flex-col min-h-screen w-full overflow-x-hidden sm:flex-row md:flex-row overflow-auto bg-gray-200">
    <nav class="px-2 py-2 font-inter sm:px-3 sm:py-3 ">
        <div>
            <h1 class="text-3xl font-bold sm:text-4xl">MyKha₹cha</h1>
            <hr>
            <h3 class="text-3xl sm:text-2xl">Track Your Expenses and Savings</h3>
        </div>
        <br>
        <br>
        <section class="font-bold leading-relaxed">
            <div class="text-3xl leading-relaxed">
                <h2>Track your Money flow and get Insights of your monthly transactions.</h2>
            </div>
            <br>
            <br>
            <div class="text-3xl">
                <h1>Start Now to get Your money on right Track! </h1>
            </div>
        </section>
    </nav>
    <div class="flex flex-row w-full min-h-screen font-poppins sm:font-sans">
        <div
            class="signUp mx-auto text-sm  min-w-full px-3 py-3 bg-gray-50 rounded-lg sm:m-auto  sm:text-xl sm:px-5py-5 shadow-2xl sm:min-w-lg">
            <form action="" class="flex flex-col justify-center align-middle gap-3 sm:gap-5">
                <h1 class="sm:text-5xl text-xl font-bold text-center ">SignUp</h1>
                <div class="flex flex-col justify-center items-center sm:min-w-full gap-2">
                    <label for="first-name">Full Name</label>
                    <input type="text" placeholder="Enter your Full Name" required
                        class="py-2 px-2  sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl">

                    <label for="email">
                        Email</label>
                    <input type="email" placeholder="Enter Your Email" required
                        class="py-2 px-2 sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl">

                    <label for="setPass">
                        SetPassword (5-10 characters)</label>
                    <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                        pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required
                        class="py-2 px-2 sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl">

                    <label for="confirmPass">
                        ConfirmPassword</label>
                    <input type="password" placeholder="Confirm Your password" minlength="5" maxlength="10"
                        pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required
                        class="py-2 px-2 sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl">

                    <div class="buttons py-3 flex flex-col gap-3 sm:gap-1">
                        <input type="button" value="SignUp"
                            class="py-2 px-2  rounded-xl  border-black border-2 sm:py-1,px-2 bg-blue-400 text-white cursor-pointer sm:min-w-lg sm:rounded-2xl">
                        <li class=" py-1 px-1 sm:py-2px-2  cursor-pointer sm:min-w-xs list-none text-center"
                            onclick="btnClicked()"><a>SignIn</a></li>

                    </div>
                </div>
            </form>
        </div>

        <div
            class="signIn hidden mx-auto text-sm px-3 py-3 bg-gray-50 rounded-lg sm:m-auto  sm:text-xl sm:px-5py-5 shadow-2xl sm:min-w-lg">

            <form action="" class="flex flex-col justify-center align-middle gap-3 sm:gap-5">
                <h1 class="sm:text-5xl text-xl font-bold text-center ">SignIn</h1>
                <div class="flex flex-col justify-center items-center sm:min-w-full gap-3">
                    <label for="email">Email</label>
                        <input type="email" placeholder="Enter your Email" required
                            class="py-2 px-2  sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl">
                    

                    <label for="pass">
                        Password (5-10 characters)</label>
                        <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                            pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required
                            class="py-2 px-2  sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl">
                    
                    <div class="buttons flex justify-between  gap-10">
                        <label for="checkbox">
                            Remember me
                            <input type="checkbox" name="checkbox"
                                class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                        </label>
                        <label for="forgotPass">
                            <li class="py-1 px-1 sm:py-2 list-none text-center">Forgot Pass?</li>
                        </label>
                    </div>
                    <div class="buttons flex flex-col gap-3 sm:gap-5">
                        <input type="button" value="SignIn"
                            class="py-2 px-2  sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl cursor-pointer bg-blue-400 text-white">
                        <input type="button" value="Close" onclick="cancelClicked()"
                            class="py-2 px-2  sm:py-1 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black sm:min-w-md sm:rounded-2xl cursor-pointer">
                    </div>
                </div>
            </form>
        </div>
    </div>
    </div>
</body>
<script>
    function btnClicked() {
        document.querySelector(".signIn").style.display = "block"
        document.querySelector(".signUp").style.display = "none"
    }
    function cancelClicked() {
        document.querySelector('.signIn').style.display = 'none'
        document.querySelector('.signUp').style.display = 'block'
    }
</script>

</html>
