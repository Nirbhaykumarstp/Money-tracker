<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>SignUp</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body class="flex flex-col min-h-screen w-full overflow-x-hidden sm:flex-row md:flex-row overflow-auto bg-amber-50">
    <nav class="px-2 py-2 font-inter sm:px-5py-5 ">
        <div>
            <h1 class="text-6xl font-bold">MyKha₹cha</h1>
            <hr>
            <h3 class="text-3xl">Track Your Expenses and Savings</h3>
        </div>
        <br>
        <br>
        <section class="font-bold leading-relaxed">
            <div class="text-4xl leading-relaxed">
                <h2>Track your Money flow and get Insights of your monthly transactions.</h2>
            </div>
            <br>
            <br>
            <div class="text-4xl">
                <h1>Start Now to get Your money on right Track! </h1>
            </div>
        </section>
    </nav>
    <div class="flex flex-row w-full min-h-screen font-poppins sm:font-sans">
        <div
            class="signUp mx-auto text-xl px-3 py-3 bg-gray-50 rounded-lg sm:m-auto  sm:text-2xl sm:px-5py-5 shadow-2xl">
            <form action="" class="flex flex-col justify-center align-middle gap-3 sm:gap-5">
                <h1 class="sm:text-5xl text-4xl font-bold text-center ">SignUp</h1>
                <label for="first-name">Full Name:
                    <input type="text" placeholder="Enter your Full Name" required
                        class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                </label>
                <label for="email">
                    Email:
                    <input type="email" placeholder="Enter Your Email" required
                        class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                </label>
                <label for="setPass">
                    SetPassword (5-10 characters):
                    <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                        pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required
                        class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                </label>
                <label for="confirmPass">
                    ConfirmPassword:
                    <input type="password" placeholder="Confirm Your password" minlength="5" maxlength="10"
                        pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required
                        class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                </label>
                <div class="buttons flex flex-col gap-3 sm:gap-5">
                    <input type="button" value="SignUp" class="py-1 px-1 w-full rounded border-black border-2 sm:py-3,px-3 bg-blue-400 text-white cursor-pointer">
                    <input type="button" value="SignIn" onclick=" btnClicked() "
                        class="border-black border-2 py-1 px-1 sm:py-2px-2 w-full cursor-pointer">
                </div>
            </form>
        </div>

        <div
            class="signIn  text-xl hidden rounded-lg px-3 py-3 mx:auto sm:m-auto sm:text-2xl sm:px-5py-5 bg-white shadow-2xl">

            <form action="" class="flex flex-col justify-center align-middle gap-3 sm:gap-5">
                <h1 class="sm:text-5xl text-4xl font-bold text-center">SignIn</h1>
                <label for="email">Email:
                    <input type="email" placeholder="Enter your Email" required
                        class="py-1  px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                </label>

                <label for="pass">
                    Password (5-10 characters)
                    <input type="password" placeholder="Enter the password" minlength="5" maxlength="10"
                        pattern="^(?=.{5,10}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$" required
                        class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                </label>
                <div class="buttons flex justify-between">
                    <label for="checkbox">
                        Remember me:
                        <input type="checkbox" name="checkbox"
                            class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                    </label>
                    <label for="forgotPass">
                        <input type="button" value="Forgot Password"
                            class="py-1 px-1 sm:py-2 border-2 border-black rounded-md focus:outline-none focus:ring-2 focus:ring-black">
                    </label>
                </div>
                <div class="buttons flex flex-col gap-3 sm:gap-5">
                    <input type="button" value="SignIn" class="py-1 px-1 border-black w-full border-2 sm:py-3,px-3 bg-blue-400 text-white cursor-pointer">
                    <input type="button" value="Cancel" onclick="cancelClicked()"
                        class="py-1 px-1 w-full border-black border-2 sm:py-2px-2 cursor-pointer">
                </div>
            </form>
        </div>
    </div>
</body>
<script>
    function btnClicked() {
        document.querySelector(".signIn").style.display = "block"
        document.querySelector(".signUp").style.display = "none"
    }
    function cancelClicked() {
        document.querySelector('.signIn').style.display = 'none'
        document.querySelector('.signUp').style.display = 'block'
    }
</script>

</html>
